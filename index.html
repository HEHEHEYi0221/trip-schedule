<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行手帳｜旅遊行程規劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--ink:#26344F;--muted:#5F7090;--sky:#4FB0E3;--sky-s:#DFF2FB;--bg:#F0F8FD;--pink:#FF8FA8;--pink-s:#FFE4EB;--sun:#FFD25E;--sun-s:#FFF4CF;--mint:#7ED6B2;--mint-s:#DCF5EA;--line:#C9DFEC;--r:18px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(circle,#D9ECF7 1.5px,transparent 1.5px) 0 0/24px 24px;color:var(--ink);font-family:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.ticket:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400}
h1{font-size:26px;margin:8px 0 14px}
h2{font-size:19px}
h3{font-size:16px;margin-bottom:8px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.small{font-size:13px;color:var(--muted)}
.top{position:sticky;top:0;z-index:20;background:rgba(240,248,253,.94);backdrop-filter:blur(6px);border-bottom:2px dashed var(--line)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.sp{flex:1}
.logo{font-size:20px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--sun)}
.btn.bad{background:var(--pink-s)}
.btn.sm{padding:3px 12px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.ib{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;display:inline-grid;place-items:center;padding:0;font-size:14px}
.ib:hover{border-color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:4px 16px}
.tab.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.ticket{position:relative;background:#fff;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.ticket:hover{transform:translateY(-2px)}
.tk-top{position:relative;padding:16px 18px;border-bottom:2px dashed var(--ink)}
.tk-top::before,.tk-top::after{content:'';position:absolute;bottom:-12px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ink)}
.tk-top::before{left:-12px}.tk-top::after{right:-12px}
.tk-name{font-size:20px}
.tk-bot{padding:14px 18px 16px}
.bar2{height:10px;border-radius:999px;background:var(--sky-s);border:2px solid var(--ink);overflow:hidden;margin:8px 0 4px}
.bar2 i{display:block;height:100%;background:var(--mint)}
.bar2.over i{background:var(--pink)}
.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 4px 0 var(--ink)}
.rowh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px}
.day{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:14px;padding:5px 14px;text-align:center;line-height:1.3}
.day small{display:block;font-size:12px;color:var(--muted)}
.day.on{background:var(--sky);border-color:var(--ink)}
.day.on small{color:var(--ink)}
.day.over{outline:3px dashed var(--pink)}
.plan{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:120px}
.spot{position:relative;display:grid;grid-template-columns:86px 1fr auto;background:#fff;border:2px solid var(--ink);border-radius:14px;margin:0 0 14px;box-shadow:0 3px 0 var(--ink);overflow:hidden}
.spot.dragging{opacity:.4}
.spot.drop-before{box-shadow:0 -6px 0 var(--pink),0 3px 0 var(--ink)}
.spot.drop-after{box-shadow:0 8px 0 var(--pink)}
.spot.flash{background:var(--sun-s)}
.stub{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:10px 6px;text-align:center;background:var(--sun-s);border-right:2px dashed var(--ink);cursor:grab}
.stub b{font-weight:400;font-size:17px}
.stub span{font-size:12px;color:var(--muted)}
.sbody{padding:10px 12px;min-width:0}
.nm{font-size:16px;word-break:break-word}
.no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sky);border:2px solid var(--ink);font-size:12px;margin-right:6px}
.meta{font-size:13px;color:var(--muted);word-break:break-word}
.acts{display:grid;grid-template-columns:repeat(2,34px);gap:4px;padding:8px;align-content:center;border-left:2px dashed var(--line)}
.sum{margin-top:4px}
.mt{margin:8px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:12px;color:var(--muted)}
.cd{aspect-ratio:1;border-radius:10px;border:2px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--muted);padding:0;line-height:1.1}
.cd.trip{background:var(--sky-s);border-color:var(--sky);color:var(--ink)}
.cd.trip.on{background:var(--sky);border-color:var(--ink)}
.cn{font-size:11px;background:var(--pink);border-radius:999px;padding:0 6px;margin-top:2px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.stat{border:2px solid var(--ink);border-radius:var(--r);padding:12px 16px;box-shadow:0 4px 0 var(--ink)}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-weight:400;font-size:24px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.exp{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dotted var(--line)}
.exp:first-child{border-top:none}
.ei{font-size:20px}
.en{flex:1;min-width:0}
.en small{display:block;color:var(--muted);font-size:13px}
.brow{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.brow .bar2{margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--sky)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(38,52,79,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.ov.hide{display:none}
.modal{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 6px 0 var(--ink)}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:999px;padding:8px 20px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.ep{text-align:center;padding:40px 16px}
.ep .big{font-size:56px}
@media (max-width:860px){
 .plan,.two{grid-template-columns:1fr}
 .side{position:static}
 .wrap{padding:12px}
}
@media (max-width:520px){
 .spot{grid-template-columns:72px 1fr}
 .acts{grid-column:1/-1;grid-template-columns:repeat(5,34px);justify-content:end;border-left:none;border-top:2px dashed var(--line)}
 .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
(function(){
'use strict';
var KEY='travel-planner-v1';
var CATS=[['sight','🎡','景點'],['food','🍜','餐飲'],['move','🚆','交通'],['stay','🏨','住宿'],['shop','🛍️','購物'],['other','✨','其他']];
var COLORS=['var(--sky)','var(--pink)','var(--sun)','var(--mint)'];
var WK=['日','一','二','三','四','五','六'];
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var catIcon=function(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][1];return '✨'};
var catName=function(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][2];return '其他'};
var pad=function(n){return (n<10?'0':'')+n};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseYmd=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
var addDays=function(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
var fmtShort=function(s){var d=parseYmd(s);return (d.getMonth()+1)+'/'+d.getDate()};
var fmtFull=function(s){return s.replace(/-/g,'/')};
var wkOf=function(s){return WK[parseYmd(s).getDay()]};
var toMin=function(t){var p=String(t).split(':');return (+p[0])*60+(+p[1]||0)};
var fromMin=function(m){m=Math.max(0,Math.min(m,1439));return pad(Math.floor(m/60))+':'+pad(m%60)};
var spotEnd=function(s){return fromMin(toMin(s.time)+s.stay)};
var fmt=function(n){return (Math.round(n*100)/100).toLocaleString('zh-TW')};
var fmtTWD=function(n){return 'NT$'+Math.round(n).toLocaleString('zh-TW')};

function normSpot(s){
  s=s||{};
  return {id:s.id||uid(),name:String(s.name||''),time:/^\d{2}:\d{2}$/.test(s.time)?s.time:'09:00',stay:Math.max(0,Number(s.stay)||0),addr:String(s.addr||''),note:String(s.note||''),cost:Math.max(0,Number(s.cost)||0),cat:catName(s.cat)==='其他'&&s.cat!=='other'?'other':s.cat};
}
function normTrip(t){
  t=t||{};
  var today=ymd(new Date());
  var n={id:t.id||uid(),name:String(t.name||'未命名旅程'),start:/^\d{4}-\d{2}-\d{2}$/.test(t.start)?t.start:today,fc:String(t.fc||'JPY').toUpperCase().slice(0,5),rate:Number(t.rate)>0?Number(t.rate):1,budget:Math.max(0,Number(t.budget)||0),days:[],expenses:[]};
  var len=Array.isArray(t.days)?t.days.length:1;
  len=Math.max(1,Math.min(60,len));
  for(var i=0;i<len;i++){
    var arr=(Array.isArray(t.days)&&Array.isArray(t.days[i]))?t.days[i]:[];
    n.days.push(arr.map(normSpot));
  }
  if(Array.isArray(t.expenses))n.expenses=t.expenses.map(function(e){
    return {id:e.id||uid(),name:String(e.name||''),amount:Number(e.amount)||0,cur:e.cur==='TWD'?'TWD':'FC',cat:catName(e.cat)==='其他'&&e.cat!=='other'?'other':e.cat,day:Number.isInteger(e.day)?e.day:-1};
  });
  return n;
}

var db={trips:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&Array.isArray(p.trips))db.trips=p.trips.map(normTrip)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('無法儲存到瀏覽器，請記得匯出備份')}}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2400)}

var ui={view:'home',trip:null,tab:'plan',day:0};
var drag=null;
var getTrip=function(){for(var i=0;i<db.trips.length;i++)if(db.trips[i].id===ui.trip)return db.trips[i];return null};
var toTWD=function(t,a,cur){return cur==='TWD'?a:a*t.rate};
var spentTWD=function(t){return t.expenses.reduce(function(a,e){return a+toTWD(t,e.amount,e.cur)},0)};
var retime=function(arr){for(var i=1;i<arr.length;i++)arr[i].time=fromMin(toMin(arr[i-1].time)+arr[i-1].stay)};
var sortDay=function(arr){arr.sort(function(a,b){return toMin(a.time)-toMin(b.time)})};

/* ---------- views ---------- */
function render(){
  var app=$('#app');
  if(ui.view==='trip'&&getTrip()){app.innerHTML=tripHTML()}
  else{ui.view='home';app.innerHTML=homeHTML()}
}
function homeHTML(){
  var cards=db.trips.map(function(t,i){
    var n=t.days.length,cnt=t.days.reduce(function(a,d){return a+d.length},0),sp=spentTWD(t);
    var pct=t.budget?Math.min(100,sp/t.budget*100):0;
    return '<div class="ticket" data-open="'+t.id+'" tabindex="0" role="button" aria-label="開啟 '+esc(t.name)+'">'+
      '<div class="tk-top" style="background:'+COLORS[i%4]+'"><div class="tk-name">'+esc(t.name)+'</div><div>✈ '+n+' 天　'+cnt+' 個景點</div></div>'+
      '<div class="tk-bot"><div>'+fmtFull(t.start)+' – '+fmtShort(addDays(t.start,n-1))+'</div>'+
      (t.budget?'<div class="bar2'+(sp>t.budget?' over':'')+'"><i style="width:'+pct+'%"></i></div><div class="small">已花 '+fmtTWD(sp)+' ／ 預算 '+fmtTWD(t.budget)+'</div>':'<div class="small" style="margin-top:8px">尚未設定預算</div>')+
      '</div></div>';
  }).join('');
  var body=db.trips.length?'<h1>我的旅程</h1><div class="grid">'+cards+'</div>':
    '<div class="ep"><div class="big">🧳</div><h1>開始規劃第一趟旅行</h1><p class="small">建立旅程後，就能排每天的景點、看地圖路線、記錄花費。</p><p><button class="btn pri" data-act="new-trip">＋ 新旅程</button> <button class="btn" data-act="sample">看看範例旅程</button></p></div>';
  return '<header class="top"><div class="wrap bar"><div class="logo">🧳 旅行手帳</div><div class="sp"></div>'+
    '<button class="btn" data-act="import">匯入</button><button class="btn" data-act="export-all">匯出全部</button><button class="btn pri" data-act="new-trip">＋ 新旅程</button></div></header>'+
    '<main class="wrap">'+body+'</main>';
}
function tripHTML(){
  var t=getTrip();
  var tabs=[['plan','行程'],['budget','預算'],['settings','設定']].map(function(x){return '<button class="tab'+(ui.tab===x[0]?' on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('');
  var body=ui.tab==='plan'?planHTML(t):ui.tab==='budget'?budgetHTML(t):settingsHTML(t);
  return '<header class="top"><div class="wrap bar"><button class="ib" data-act="home" aria-label="回旅程列表">←</button><div class="logo">'+esc(t.name)+'</div><div class="sp"></div><nav class="tabs">'+tabs+'</nav></div></header><main class="wrap">'+body+'</main>';
}
function planHTML(t){
  if(ui.day>=t.days.length)ui.day=0;
  var day=t.days[ui.day];
  var btns=t.days.map(function(d,i){var s=addDays(t.start,i);return '<button class="day'+(i===ui.day?' on':'')+'" data-day="'+i+'">第 '+(i+1)+' 天<small>'+fmtShort(s)+'（'+wkOf(s)+'）</small></button>'}).join('');
  var total=day.reduce(function(a,s){return a+s.cost},0);
  var spots=day.length?day.map(function(s,i){return spotHTML(t,s,i,day.length)}).join(''):'<div class="empty">這天還沒有行程。<br>新增第一個景點吧。</div>';
  return '<div class="days">'+btns+'</div><div class="plan"><section>'+
    '<div class="card"><div class="rowh"><h2>第 '+(ui.day+1)+' 天・'+fmtShort(addDays(t.start,ui.day))+'</h2><button class="btn pri" data-act="add-spot">＋ 新增景點</button></div>'+
    '<div id="spots">'+spots+'</div>'+
    (day.length?'<div class="small sum">共 '+day.length+' 個景點，預估 '+fmt(total)+' '+esc(t.fc)+'（約 '+fmtTWD(total*t.rate)+'）。拖拉景點可調整順序，也能拖到上方其他天。</div>':'')+
    '</div></section><section class="side"><div class="card"><h3>旅程月曆</h3>'+calHTML(t)+'</div></section></div>';
}
function spotHTML(t,s,i,n){
  return '<div class="spot" draggable="true" data-id="'+s.id+'">'+
    '<div class="stub" title="拖拉調整順序"><b>'+s.time+'</b><span>'+(s.stay?'停留 '+s.stay+' 分':'')+'</span></div>'+
    '<div class="sbody"><div class="nm"><span class="no">'+(i+1)+'</span>'+catIcon(s.cat)+' '+esc(s.name)+'</div>'+
    (s.addr?'<div class="meta">📍 '+esc(s.addr)+'</div>':'')+(s.note?'<div class="meta">📝 '+esc(s.note)+'</div>':'')+(s.cost?'<div class="meta">💰 '+fmt(s.cost)+' '+esc(t.fc)+'</div>':'')+'</div>'+
    '<div class="acts"><button class="ib" data-up="'+s.id+'" aria-label="上移"'+(i===0?' disabled':'')+'>▲</button><button class="ib" data-down="'+s.id+'" aria-label="下移"'+(i===n-1?' disabled':'')+'>▼</button>'+
    '<button class="ib" data-edit="'+s.id+'" aria-label="編輯">✎</button>'+
    (s.cost?'<button class="ib" data-tox="'+s.id+'" aria-label="轉為費用記錄" title="轉為費用記錄">💰</button>':'')+
    '<button class="ib" data-del="'+s.id+'" aria-label="刪除">🗑</button></div></div>';
}
function calHTML(t){
  var n=t.days.length,first=parseYmd(t.start),last=parseYmd(addDays(t.start,n-1));
  var y=first.getFullYear(),m=first.getMonth(),out='';
  while(y<last.getFullYear()||(y===last.getFullYear()&&m<=last.getMonth())){
    var dim=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay();
    var cells=WK.map(function(w){return '<div class="wd">'+w+'</div>'}).join('');
    for(var k=0;k<off;k++)cells+='<div></div>';
    for(var d=1;d<=dim;d++){
      var idx=Math.round((new Date(y,m,d)-first)/864e5);
      if(idx>=0&&idx<n)cells+='<button class="cd trip'+(idx===ui.day?' on':'')+'" data-day="'+idx+'" aria-label="第 '+(idx+1)+' 天">'+d+'<span class="cn">'+t.days[idx].length+'</span></button>';
      else cells+='<div class="cd">'+d+'</div>';
    }
    out+='<div class="mt">'+y+' 年 '+(m+1)+' 月</div><div class="cal">'+cells+'</div>';
    m++;if(m>11){m=0;y++}
  }
  return out+'<div class="small" style="margin-top:8px">藍色是旅程日，數字是當天的景點數。</div>';
}
function budgetHTML(t){
  var sp=spentTWD(t),left=t.budget-sp,pct=t.budget?Math.min(100,sp/t.budget*100):0;
  var byCat={},byDay={};
  t.expenses.forEach(function(e){var v=toTWD(t,e.amount,e.cur);byCat[e.cat]=(byCat[e.cat]||0)+v;byDay[e.day]=(byDay[e.day]||0)+v});
  var cmax=Math.max.apply(null,[1].concat(Object.keys(byCat).map(function(k){return byCat[k]})));
  var dmax=Math.max.apply(null,[1].concat(Object.keys(byDay).map(function(k){return byDay[k]})));
  var catRows=CATS.filter(function(c){return byCat[c[0]]}).map(function(c){return '<div class="brow"><span>'+c[1]+' '+c[2]+'</span><div class="bar2"><i style="width:'+byCat[c[0]]/cmax*100+'%"></i></div><b style="font-weight:400">'+fmtTWD(byCat[c[0]])+'</b></div>'}).join('')||'<div class="small">還沒有費用記錄。</div>';
  var dayRows=Object.keys(byDay).map(Number).sort(function(a,b){return a-b}).map(function(k){return '<div class="brow"><span>'+(k>=0&&k<t.days.length?'第 '+(k+1)+' 天':'未指定')+'</span><div class="bar2"><i style="width:'+byDay[k]/dmax*100+'%"></i></div><b style="font-weight:400">'+fmtTWD(byDay[k])+'</b></div>'}).join('');
  var est=t.days.reduce(function(a,d){return a+d.reduce(function(b,s){return b+s.cost},0)},0);
  var list=t.expenses.slice().reverse().map(function(e){
    var amt=e.cur==='TWD'?fmtTWD(e.amount):fmt(e.amount)+' '+esc(t.fc)+'（約 '+fmtTWD(e.amount*t.rate)+'）';
    return '<div class="exp"><span class="ei">'+catIcon(e.cat)+'</span><div class="en"><b style="font-weight:400">'+esc(e.name||catName(e.cat))+'</b><small>'+(e.day>=0&&e.day<t.days.length?'第 '+(e.day+1)+' 天・':'')+amt+'</small></div><button class="ib" data-delexp="'+e.id+'" aria-label="刪除費用">🗑</button></div>';
  }).join('')||'<div class="empty">還沒有費用。<br>在上方記下第一筆花費吧。</div>';
  var dayOpts='<option value="-1">不指定</option>'+t.days.map(function(d,i){return '<option value="'+i+'"'+(i===ui.day?' selected':'')+'>第 '+(i+1)+' 天</option>'}).join('');
  var catOpts=CATS.map(function(c){return '<option value="'+c[0]+'">'+c[1]+' '+c[2]+'</option>'}).join('');
  return '<div class="stats">'+
    '<div class="stat" style="background:var(--sky-s)"><small>總預算</small><b>'+(t.budget?fmtTWD(t.budget):'未設定')+'</b></div>'+
    '<div class="stat" style="background:var(--sun-s)"><small>已花費</small><b>'+fmtTWD(sp)+'</b></div>'+
    '<div class="stat" style="background:'+(t.budget&&left<0?'var(--pink-s)':'var(--mint-s)')+'"><small>'+(t.budget&&left<0?'超支':'剩餘')+'</small><b>'+(t.budget?fmtTWD(Math.abs(left)):'—')+'</b></div></div>'+
    (t.budget?'<div class="bar2'+(sp>t.budget?' over':'')+'" style="margin:-4px 0 18px;height:14px"><i style="width:'+pct+'%"></i></div>':'')+
    '<div class="two"><section><div class="card"><h3>記一筆</h3>'+
    '<form data-form="expense"><div class="row"><div><label>項目</label><input name="name" placeholder="例如：地鐵一日券"></div><div><label>金額</label><input name="amount" type="number" min="0" step="any" required></div></div>'+
    '<div class="row"><div><label>幣別</label><select name="cur"><option value="FC">'+esc(t.fc)+'（外幣）</option><option value="TWD">TWD（台幣）</option></select></div><div><label>類別</label><select name="cat">'+catOpts+'</select></div></div>'+
    '<label>哪一天</label><select name="day">'+dayOpts+'</select><div class="mbtns"><button class="btn pri" type="submit">記下來</button></div></form></div>'+
    '<div class="card"><h3>費用明細</h3>'+list+'</div></section>'+
    '<section><div class="card"><h3>各類別花費</h3>'+catRows+'</div>'+
    (dayRows?'<div class="card"><h3>每天花費</h3>'+dayRows+'</div>':'')+
    '<div class="card"><h3>景點預估費用</h3><div>'+fmt(est)+' '+esc(t.fc)+'</div><div class="small">約 '+fmtTWD(est*t.rate)+'。在行程頁按 💰 可把景點的預估費用轉為費用記錄。</div></div></section></div>';
}
function settingsHTML(t){
  var end=addDays(t.start,t.days.length-1);
  return '<div class="card" style="max-width:560px"><h2 style="margin-bottom:6px">旅程設定</h2><form data-form="settings">'+
    '<label>旅程名稱</label><input name="name" required value="'+esc(t.name)+'">'+
    '<div class="row"><div><label>出發日期</label><input type="date" name="start" required value="'+t.start+'"></div><div><label>結束日期</label><input type="date" name="end" required value="'+end+'"></div></div>'+
    '<div class="row"><div><label>外幣代碼</label><input name="fc" maxlength="5" required value="'+esc(t.fc)+'"></div><div><label>匯率（1 '+esc(t.fc)+' 等於幾元台幣）</label><input type="number" name="rate" min="0" step="any" required value="'+t.rate+'"></div></div>'+
    '<label>總預算（台幣）</label><input type="number" name="budget" min="0" step="any" value="'+(t.budget||'')+'">'+
    '<div class="mbtns" style="justify-content:space-between"><button type="button" class="btn bad" data-act="delete-trip">刪除這趟旅程</button><button class="btn pri" type="submit">儲存設定</button></div></form></div>'+
    '<div class="card" style="max-width:560px"><h3>備份</h3><p class="small">資料只存在這個瀏覽器裡。清除瀏覽器資料前，記得先匯出備份；也可以用匯出的檔案把行程搬到手機。</p><button class="btn" data-act="export-trip">匯出這趟旅程</button></div>';
}

/* ---------- modal ---------- */
function closeModal(){$('#modalRoot').innerHTML=''}
function openModal(title,html,onSave,okText){
  closeModal();
  $('#modalRoot').innerHTML='<div class="ov" id="ov"><form class="modal" id="mform" novalidate><h2>'+title+'</h2>'+html+'<div class="mbtns"><button type="button" class="btn" id="mcancel">取消</button><button class="btn pri" type="submit">'+(okText||'儲存')+'</button></div></form></div>';
  $('#mcancel').onclick=closeModal;
  $('#ov').addEventListener('mousedown',function(ev){if(ev.target.id==='ov')closeModal()});
  $('#mform').onsubmit=function(ev){ev.preventDefault();if(onSave(new FormData(ev.target))!==false)closeModal()};
  var f=$('#mform input');if(f)f.focus();
}
function dayRange(start,end){
  if(!start||!end)return 0;
  return Math.round((parseYmd(end)-parseYmd(start))/864e5)+1;
}
function openTripModal(){
  var s=ymd(new Date());
  openModal('新旅程',
    '<label>旅程名稱</label><input name="name" placeholder="例如：東京五日遊">'+
    '<div class="row"><div><label>出發日期</label><input type="date" name="start" value="'+s+'"></div><div><label>結束日期</label><input type="date" name="end" value="'+addDays(s,4)+'"></div></div>'+
    '<div class="row"><div><label>外幣代碼</label><input name="fc" maxlength="5" value="JPY"></div><div><label>匯率（1 外幣等於幾元台幣）</label><input type="number" name="rate" min="0" step="any" value="0.21"></div></div>'+
    '<label>總預算（台幣，可先不填）</label><input type="number" name="budget" min="0" step="any">',
    function(fd){
      var name=fd.get('name').trim();if(!name){toast('請輸入旅程名稱');return false}
      var len=dayRange(fd.get('start'),fd.get('end'));
      if(len<1||len>60){toast('日期範圍要在 1 到 60 天之間');return false}
      var days=[];for(var i=0;i<len;i++)days.push([]);
      var t=normTrip({name:name,start:fd.get('start'),fc:fd.get('fc').trim()||'JPY',rate:parseFloat(fd.get('rate'))||1,budget:parseFloat(fd.get('budget'))||0,days:days});
      db.trips.push(t);save();ui={view:'trip',trip:t.id,tab:'plan',day:0};render();window.scrollTo(0,0);
    },'建立旅程');
}
function openSpotModal(spotId){
  var t=getTrip(),arr=t.days[ui.day],s=null;
  if(spotId)s=arr.filter(function(x){return x.id===spotId})[0];
  var defTime=s?s.time:(arr.length?spotEnd(arr[arr.length-1]):'09:00');
  var catOpts=CATS.map(function(c){return '<option value="'+c[0]+'"'+(s&&s.cat===c[0]?' selected':'')+'>'+c[1]+' '+c[2]+'</option>'}).join('');
  var dayOpts=t.days.map(function(d,i){return '<option value="'+i+'"'+(i===ui.day?' selected':'')+'>第 '+(i+1)+' 天（'+fmtShort(addDays(t.start,i))+'）</option>'}).join('');
  openModal(s?'編輯景點':'新增景點',
    '<label>名稱</label><input name="name" value="'+esc(s?s.name:'')+'" placeholder="例如：淺草寺">'+
    '<div class="row"><div><label>開始時間</label><input type="time" name="time" value="'+defTime+'"></div><div><label>停留時間（分鐘）</label><input type="number" name="stay" min="0" step="5" value="'+(s?s.stay:60)+'"></div></div>'+
    '<label>地點（地址或地名，可不填）</label><input name="addr" value="'+esc(s?s.addr:'')+'" placeholder="例如：東京都台東區淺草">'+
    '<div class="row"><div><label>類別</label><select name="cat">'+catOpts+'</select></div><div><label>預估費用（'+esc(t.fc)+'）</label><input type="number" name="cost" min="0" step="any" value="'+(s&&s.cost?s.cost:'')+'"></div></div>'+
    '<label>所屬天數</label><select name="day">'+dayOpts+'</select>'+
    '<label>備註</label><textarea name="note" rows="2">'+esc(s?s.note:'')+'</textarea>',
    function(fd){
      var name=fd.get('name').trim();if(!name){toast('請輸入景點名稱');return false}
      var obj={id:s?s.id:uid(),name:name,time:fd.get('time')||'09:00',stay:Math.max(0,parseInt(fd.get('stay'),10)||0),addr:fd.get('addr').trim(),note:fd.get('note').trim(),cost:Math.max(0,parseFloat(fd.get('cost'))||0),cat:fd.get('cat')};
      if(s)arr.splice(arr.indexOf(s),1);
      var nd=parseInt(fd.get('day'),10);if(!(nd>=0&&nd<t.days.length))nd=ui.day;
      t.days[nd].push(normSpot(obj));sortDay(t.days[nd]);
      ui.day=nd;save();render();
    },s?'儲存':'加入行程');
}

/* ---------- actions ---------- */
function moveSpot(t,fromDay,id,toDay,refId,after){
  var src=t.days[fromDay],dst=t.days[toDay],i=-1;
  src.forEach(function(x,k){if(x.id===id)i=k});if(i<0)return;
  var srcStart=src.length?src[0].time:null;
  var dstStart=fromDay===toDay?srcStart:(dst.length?dst[0].time:null);
  var s=src.splice(i,1)[0],at=dst.length;
  if(refId){var j=-1;dst.forEach(function(x,k){if(x.id===refId)j=k});if(j>=0)at=after?j+1:j}
  dst.splice(at,0,s);
  if(dstStart)dst[0].time=dstStart;
  retime(dst);
  if(fromDay!==toDay&&src.length){if(srcStart)src[0].time=srcStart;retime(src)}
  save();
}
function download(name,obj){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
}
function sampleTrip(){
  var sp=function(name,time,stay,addr,cost,cat,note){return {id:uid(),name:name,time:time,stay:stay,addr:addr,cost:cost,cat:cat,note:note||''}};
  return normTrip({name:'東京三日遊（範例）',start:addDays(ymd(new Date()),30),fc:'JPY',rate:0.21,budget:30000,
    days:[
      [sp('淺草寺','09:00',60,'東京都台東區淺草',0,'sight','人少，早點去'),sp('天丼午餐','10:00',60,'淺草',1800,'food'),sp('晴空塔','11:00',120,'東京晴空塔',2100,'sight','先網路訂票')],
      [sp('明治神宮','10:00',90,'東京都澀谷區代代木神園町',0,'sight'),sp('竹下通','11:30',90,'原宿',1200,'shop'),sp('澀谷十字路口','13:00',60,'澀谷',0,'sight','傍晚看夜景更漂亮')],
      [sp('築地場外市場','09:00',120,'東京都中央區築地',2000,'food'),sp('銀座逛街','11:00',150,'銀座',5000,'shop')]
    ],
    expenses:[{name:'成田快線',amount:3070,cur:'FC',cat:'move',day:0},{name:'飯店三晚',amount:9000,cur:'TWD',cat:'stay',day:-1}]});
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-open],[data-tab],[data-day],[data-act],[data-up],[data-down],[data-edit],[data-del],[data-tox],[data-delexp]');
  if(!el||el.disabled)return;
  var d=el.dataset,t=ui.trip?getTrip():null;
  if(d.open){ui={view:'trip',trip:d.open,tab:'plan',day:0};render();window.scrollTo(0,0)}
  else if(d.tab){ui.tab=d.tab;render()}
  else if(d.day!==undefined){ui.day=+d.day;render()}
  else if(d.up||d.down){
    var id=d.up||d.down,arr=t.days[ui.day],i=-1;arr.forEach(function(x,k){if(x.id===id)i=k});
    var ref=d.up?arr[i-1]:arr[i+1];if(!ref)return;
    moveSpot(t,ui.day,id,ui.day,ref.id,!!d.down);render();
  }
  else if(d.edit)openSpotModal(d.edit);
  else if(d.del){
    var arr2=t.days[ui.day],sp=arr2.filter(function(x){return x.id===d.del})[0];
    if(sp&&confirm('要刪除「'+sp.name+'」嗎？')){arr2.splice(arr2.indexOf(sp),1);save();render()}
  }
  else if(d.tox){
    var sp2=t.days[ui.day].filter(function(x){return x.id===d.tox})[0];
    if(sp2){t.expenses.push({id:uid(),name:sp2.name,amount:sp2.cost,cur:'FC',cat:sp2.cat,day:ui.day});save();toast('已加入費用記錄')}
  }
  else if(d.delexp){t.expenses=t.expenses.filter(function(x){return x.id!==d.delexp});save();render()}
  else if(d.act==='home'){ui.view='home';render()}
  else if(d.act==='new-trip')openTripModal();
  else if(d.act==='import')$('#file').click();
  else if(d.act==='export-all'){if(!db.trips.length){toast('還沒有旅程可以匯出');return}download('旅行手帳-全部旅程.json',{app:'travel-planner',version:1,trips:db.trips})}
  else if(d.act==='sample'){var st=sampleTrip();db.trips.push(st);save();ui={view:'trip',trip:st.id,tab:'plan',day:0};render()}
  else if(d.act==='add-spot')openSpotModal();
  else if(d.act==='export-trip')download('旅程-'+t.name+'.json',{app:'travel-planner',version:1,trips:[t]});
  else if(d.act==='delete-trip'){
    if(confirm('確定要刪除「'+t.name+'」嗎？刪除後無法復原，建議先匯出備份。')){db.trips=db.trips.filter(function(x){return x.id!==t.id});save();ui.view='home';render()}
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#ov'))closeModal()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.ticket')){e.preventDefault();e.target.click()}
});

document.addEventListener('submit',function(e){
  var f=e.target,kind=f.dataset&&f.dataset.form;if(!kind)return;
  e.preventDefault();
  var t=getTrip(),fd=new FormData(f);
  if(kind==='expense'){
    var amt=parseFloat(fd.get('amount'));if(!(amt>=0)||isNaN(amt)){toast('請輸入金額');return}
    t.expenses.push({id:uid(),name:fd.get('name').trim(),amount:amt,cur:fd.get('cur')==='TWD'?'TWD':'FC',cat:fd.get('cat'),day:parseInt(fd.get('day'),10)});
    save();render();toast('已記下這筆花費');
  }else if(kind==='settings'){
    var name=fd.get('name').trim(),start=fd.get('start'),len=dayRange(start,fd.get('end'));
    if(!name){toast('請輸入旅程名稱');return}
    if(len<1||len>60){toast('日期範圍要在 1 到 60 天之間');return}
    if(len<t.days.length){
      var lost=t.days.slice(len).some(function(d){return d.length});
      if(lost&&!confirm('縮短日期會刪掉最後幾天已排的景點，確定要繼續嗎？'))return;
      t.days.length=len;
    }else while(t.days.length<len)t.days.push([]);
    t.expenses.forEach(function(x){if(x.day>=len)x.day=-1});
    t.name=name;t.start=start;t.fc=(fd.get('fc').trim()||'JPY').toUpperCase().slice(0,5);
    t.rate=parseFloat(fd.get('rate'))>0?parseFloat(fd.get('rate')):1;t.budget=Math.max(0,parseFloat(fd.get('budget'))||0);
    if(ui.day>=len)ui.day=0;
    save();render();toast('設定已儲存');
  }
});

$('#file').addEventListener('change',function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result),list=Array.isArray(obj)?obj:(obj&&Array.isArray(obj.trips)?obj.trips:(obj&&Array.isArray(obj.days)?[obj]:null));
      if(!list||!list.length)throw new Error('format');
      list.forEach(function(t){var n=normTrip(t);n.id=uid();db.trips.push(n)});
      save();render();toast('已匯入 '+list.length+' 趟旅程');
    }catch(err){toast('這個檔案無法匯入，請確認是從旅行手帳匯出的 JSON')}
  };
  r.readAsText(f);
});

/* drag and drop */
document.addEventListener('dragstart',function(e){
  var el=e.target.closest&&e.target.closest('.spot');if(!el)return;
  drag={id:el.dataset.id};e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',drag.id)}catch(_){}
  setTimeout(function(){el.classList.add('dragging')},0);
});
function clearDrop(){Array.prototype.forEach.call(document.querySelectorAll('.drop-before,.drop-after,.over'),function(x){x.classList.remove('drop-before','drop-after','over')})}
document.addEventListener('dragend',function(){drag=null;clearDrop();Array.prototype.forEach.call(document.querySelectorAll('.dragging'),function(x){x.classList.remove('dragging')})});
document.addEventListener('dragover',function(e){
  if(!drag)return;
  var sp=e.target.closest('.spot'),db2=e.target.closest('.day[data-day]'),ls=e.target.closest('#spots');
  if(!(sp||db2||ls))return;
  e.preventDefault();clearDrop();
  if(sp&&sp.dataset.id!==drag.id){var r=sp.getBoundingClientRect();sp.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after')}
  else if(db2&&+db2.dataset.day!==ui.day)db2.classList.add('over');
});
document.addEventListener('drop',function(e){
  if(!drag)return;
  var sp=e.target.closest('.spot'),db2=e.target.closest('.day[data-day]'),ls=e.target.closest('#spots');
  if(!(sp||db2||ls))return;
  e.preventDefault();
  var t=getTrip(),toDay=ui.day,ref=null,after=false;
  if(db2)toDay=+db2.dataset.day;
  else if(sp){
    if(sp.dataset.id===drag.id){clearDrop();return}
    var r=sp.getBoundingClientRect();ref=sp.dataset.id;after=e.clientY>=r.top+r.height/2;
  }
  moveSpot(t,ui.day,drag.id,toDay,ref,after);
  drag=null;clearDrop();render();
});

render();
})();
</script>
</body>
</html>
